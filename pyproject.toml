[project]
name = "ruitong-bridge"
version = "0.1.0"
description = "瑞通 (Ruitong) — CANN/CUDA Bridge API"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.0",
    # Runtime, not dev: the Phase 3 backend client speaks HTTP to vLLM.
    "httpx>=0.27",
    # Needed to actually serve the FastAPI app.
    "uvicorn>=0.30",
    "tiktoken>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    # Mocks the httpx transport so backend tests never touch the network.
    "respx>=0.21",
    # Contract errors in Protocol signatures are invisible to runtime tests.
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ruitong"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
# Without this plugin mypy does not understand `class M(BaseModel, frozen=True)`
# and reports a false positive on every model.
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[project.scripts]
ruitong = "ruitong.cli:main"
